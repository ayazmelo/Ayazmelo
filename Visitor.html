<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21164b">

<title>Visitor Portal | Ayaz Melo 2026</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f8f2e8;
color:#21164b;
}

header{
background:#21164b;
color:white;
padding:22px;
text-align:center;
}

header h1{
color:#f4a21d;
letter-spacing:2px;
}

header p{
font-size:12px;
margin-top:7px;
}

.container{
max-width:650px;
margin:35px auto;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 8px 30px #0001;
}

.card h2{
margin-bottom:12px;
}

.card p{
color:#777;
line-height:1.7;
}

.field{
margin-top:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:9px;
font-size:16px;
}

button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:30px;
background:#f4a21d;
color:#21164b;
font-weight:bold;
cursor:pointer;
}

footer{
text-align:center;
padding:25px;
color:#777;
font-size:12px;
}

</style>
</head>

<body>

<header>
<h1>AYAZ MELO 2026</h1>
<p>VISITOR MANAGEMENT PORTAL</p>
</header>

<div class="container">

<div class="card">

<h2>Visitor Registration</h2>

<p>
Welcome to Ayaz Melo 2026.
Register yourself to receive your personal digital QR entry pass.
</p>

<form id="visitorForm">

<div class="field">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="field">
<label>Father's Name</label>
<input type="text" required>
</div>

<div class="field">
<label>Contact Number</label>
<input type="tel" required>
</div>

<div class="field">
<label>City</label>
<input type="text" required>
</div>

<div class="field">
<label>Designation</label>
<input type="text" required>
</div>

<button type="submit">
REGISTER AS VISITOR
</button>

</form>

<p id="message" style="margin-top:15px"></p>

</div>
</div>

<footer>
© 2026 Ayaz Melo | Hosted by Khanabadosh
</footer>

<script>
document.getElementById("visitorForm")
.addEventListener("submit",function(e){
e.preventDefault();

document.getElementById("message").textContent=
"Portal design is ready. Registration database connection will be added in the next step.";
});
</script>

</body>
</html>
