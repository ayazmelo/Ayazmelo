}
.nav-links .nav-apply:hover{

}

/* BUTTONS */
.btn{

 font-weight:700;
 letter-spacing:1.2px;
 transition:.25s;
}
.btn:hover{
 background:var(--white);
 border-color:var(--white);
 transform:translateY(-2px);
}
.btn.dark{

}
.btn.dark:hover{

}
.btn.outline{

}
.btn.outline:hover{

}

}

 letter-spacing:2px;
}
.hero-bottom span{color:var(--gold)}
