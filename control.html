<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21164d">
<title>Ayaz Melo | Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
 --blue:#21164d;
 --maroon:#842c3c;
 --gold:#d9ae62;
 --cream:#faf5eb;
 --dark:#171323;
}

* {
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body {
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:var(--blue);
 font-family:'Montserrat',sans-serif;
}

.login-box {
 width:100%;
 max-width:430px;
 background:var(--cream);
 padding:40px 30px;
 border-radius:12px;
 box-shadow:0 15px 50px #0004;
 text-align:center;
}

.logo {
 width:105px;
 height:105px;
 object-fit:contain;
 margin-bottom:15px;
}

h1 {
 font-family:'Cormorant Garamond',serif;
 color:var(--blue);
 font-size:38px;
}

.subtitle {
 color:var(--maroon);
 font-size:10px;
 font-weight:800;
 letter-spacing:3px;
 margin:8px 0 30px;
}

input {
 width:100%;
 padding:15px;
 margin:9px 0;
 border:1px solid #ddd;
 border-radius:5px;
 font-family:inherit;
 font-size:13px;
 outline:none;
}

input:focus {
 border-color:var(--gold);
}

button {
 width:100%;
 padding:15px;
 margin-top:15px;
 background:var(--maroon);
 color:white;
 border:0;
 border-radius:5px;
 font-weight:800;
 letter-spacing:2px;
 cursor:pointer;
}

button:disabled {
 opacity:.6;
 cursor:wait;
}

.message {
 margin-top:18px;
 font-size:12px;
 line-height:1.8;
}

.back {
 display:inline-block;
 margin-top:25px;
 color:var(--blue);
 font-size:11px;
 font-weight:700;
}

.hidden {
 display:none;
}
</style>
</head>

<body>

<div class="login-box">

<img class="logo"
src="assets/ayaz-melo-2026.png"
alt="Ayaz Melo Logo">

<h1>Admin Portal</h1>

<div class="subtitle">
AYAZ MELO 2026 · ADMINISTRATION
</div>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Admin Email Address"
autocomplete="username"
required>

<input
type="password"
id="password"
placeholder="Admin Password"
autocomplete="current-password"
required>

<button type="submit" id="loginBtn">
ADMIN LOGIN
</button>

</form>

<div class="message" id="message"></div>

<div id="dashboard" class="hidden">

<h2 style="color:#21164d;margin-top:20px;">
Welcome, Administrator
</h2>

<p style="font-size:12px;margin-top:10px;">
Your Admin account has been authenticated.
</p>

<button id="logoutBtn">
LOG OUT
</button>

</div>

<a href="index.html" class="back">
← BACK TO WEBSITE
</a>

</div>

<script>
const SUPABASE_URL =
"https://fstkhwoxbgdcdfwycggu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BNRQfiLDVM-892aVwO_hJw_OAhEgTrq";

const ADMIN_UID =
"327072bb-a41b-4387-aadc-10b2c38ecfe4";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const dashboard = document.getElementById("dashboard");

form.addEventListener("submit", async function(e) {

 e.preventDefault();

 loginBtn.disabled = true;
 loginBtn.textContent = "VERIFYING...";
 message.textContent = "";

 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 const { data, error } = await db.auth.signInWithPassword({
  email: email,
  password: password
 });

 loginBtn.disabled = false;
 loginBtn.textContent = "ADMIN LOGIN";

 if(error) {
  message.style.color = "#842c3c";
  message.textContent = error.message;
  return;
 }

 if(!data.user || data.user.id !== ADMIN_UID) {

  await db.auth.signOut();

  message.style.color = "#842c3c";
  message.textContent = "Access denied. You are not an authorized administrator.";
  return;
 }

 form.classList.add("hidden");
 dashboard.classList.remove("hidden");

 message.style.color = "green";
 message.textContent = "Admin authentication successful.";

});

document.getElementById("logoutBtn").addEventListener("click", async function() {

 await db.auth.signOut();
 window.location.reload();

});
</script>

</body>
</html>
