<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaz Melo 2026 | Free Entry Pass</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#101b18;
  color:#fff;
}
.container{
  max-width:520px;
  margin:30px auto;
  padding:28px;
  background:#192a25;
  border:1px solid #b99b58;
  border-radius:16px;
}
h1{text-align:center;color:#e5c477}
.subtitle{text-align:center;color:#ddd;line-height:1.6}
label{display:block;margin-top:15px;margin-bottom:6px}
input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #777;
  background:#fff;
  font-size:16px;
}
button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#d4ad59;
  color:#17231e;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6}
#message{text-align:center;margin-top:15px}
#pass{
  display:none;
  margin-top:25px;
  padding:22px;
  background:#fff;
  color:#17231e;
  border-radius:12px;
  text-align:center;
}
#qrcode{
  display:flex;
  justify-content:center;
  margin:20px auto;
}
.pass-title{color:#98732d}
.small{font-size:13px;color:#555}
</style>
</head>

<body>

<div class="container">

<h1>AYAZ MELO 2026</h1>

<p class="subtitle">
Three Days of Literature, Culture & Celebration<br>
19 – 21 December 2026<br>
<strong>FREE ENTRY REGISTRATION</strong>
</p>

<form id="visitorForm">

<label>Full Name *</label>
<input id="name" required>

<label>Father's Name *</label>
<input id="father" required>

<label>Contact Number *</label>
<input id="phone" type="tel" required>

<label>City *</label>
<input id="city" required>

<label>Designation *</label>
<input id="designation" required>

<label>Email Address *</label>
<input id="email" type="email" required>

<button id="submitBtn" type="submit">
GET FREE ENTRY PASS
</button>

</form>

<div id="message"></div>

<div id="pass">
  <h2 class="pass-title">AYAZ MELO 2026</h2>
  <h3>YOUR ENTRY PASS</h3>

  <p><strong id="passName"></strong></p>
  <p id="passCity"></p>
  <p><strong id="passID"></strong></p>

  <div id="qrcode"></div>

  <p><strong>19 – 21 DECEMBER 2026</strong></p>
  <p class="small">Show this QR Pass at the entrance gate.</p>

  <button onclick="downloadPass()">DOWNLOAD PASS</button>
</div>

</div>

<script>
const SUPABASE_URL = "https://fstkhwoxbgdcdfwycggu.supabase.co";
const SUPABASE_KEY = "sb_publishable_BNRfiLDVM-892aVwO_hJw_OAhEgTrq";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentPassCanvas = null;

document.getElementById("visitorForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const button = document.getElementById("submitBtn");
  const message = document.getElementById("message");

  button.disabled = true;
  button.innerText = "PLEASE WAIT...";
  message.innerText = "";

  const fullName = document.getElementById("name").value.trim();
  const fatherName = document.getElementById("father").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const city = document.getElementById("city").value.trim();
  const designation = document.getElementById("designation").value.trim();
  const email = document.getElementById("email").value.trim();

  try {

    const { data, error } = await supabaseClient.rpc("register_visitor", {
      p_full_name: fullName,
      p_father_name: fatherName,
      p_contact_number: phone,
      p_city: city,
      p_designation: designation,
      p_email: email
    });

    if(error) throw error;

    const registration = data[0];

    const verificationURL =
      window.location.origin +
      "/Ayazmelo/verify.html?id=" +
      encodeURIComponent(registration.registration_id) +
      "&token=" +
      encodeURIComponent(registration.qr_token);

    document.getElementById("visitorForm").style.display = "none";

    message.innerHTML =
      "<h2 style='color:#e5c477'>Welcome to Ayaz Melo 2026!</h2>" +
      "<p>Your registration has been completed successfully.</p>";

    document.getElementById("pass").style.display = "block";
    document.getElementById("passName").innerText = fullName;
    document.getElementById("passCity").innerText = city;
    document.getElementById("passID").innerText =
      "Registration ID: " + registration.registration_id;

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(document.getElementById("qrcode"), {
      text: verificationURL,
      width: 190,
      height: 190,
      correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(createPassImage, 500);

  } catch(error) {

    message.innerText = "Registration failed: " + error.message;
    button.disabled = false;
    button.innerText = "GET FREE ENTRY PASS";

  }

});

function createPassImage(){

  const qrCanvas = document.querySelector("#qrcode canvas");
  if(!qrCanvas) return;

  const canvas = document.createElement("canvas");
  canvas.width = 700;
  canvas.height = 950;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,700,950);

  ctx.strokeStyle = "#b99b58";
  ctx.lineWidth = 12;
  ctx.strokeRect(20,20,660,910);

  ctx.textAlign = "center";

  ctx.fillStyle = "#18352b";
  ctx.font = "bold 48px Arial";
  ctx.fillText("AYAZ MELO 2026",350,110);

  ctx.fillStyle = "#98732d";
  ctx.font = "bold 30px Arial";
  ctx.fillText("OFFICIAL ENTRY PASS",350,165);

  ctx.fillStyle = "#222";
  ctx.font = "bold 34px Arial";
  ctx.fillText(document.getElementById("passName").innerText,350,245);

  ctx.font = "25px Arial";
  ctx.fillText(document.getElementById("passCity").innerText,350,300);

  ctx.font = "bold 24px Arial";
  ctx.fillText(document.getElementById("passID").innerText,350,360);

  ctx.drawImage(qrCanvas,230,400,240,240);

  ctx.fillStyle = "#18352b";
  ctx.font = "bold 30px Arial";
  ctx.fillText("19 – 21 DECEMBER 2026",350,720);

  ctx.font = "22px Arial";
  ctx.fillText("FREE ENTRY • SHOW QR AT GATE",350,780);

  ctx.font = "19px Arial";
  ctx.fillText("Every Story, Every Voice, One Melo",350,850);

  currentPassCanvas = canvas;
}

function downloadPass(){

  if(!currentPassCanvas){
    alert("Please wait. Your pass is being prepared.");
    return;
  }

  const link = document.createElement("a");
  link.download = "Ayaz-Melo-2026-Entry-Pass.png";
  link.href = currentPassCanvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
