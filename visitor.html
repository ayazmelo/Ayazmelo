<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayaz Melo 2026 | Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#17251e;
 color:#fff;
 font-family:Arial,sans-serif;
 padding:20px;
}
.container{
 max-width:650px;
 margin:35px auto;
 background:#24372e;
 padding:30px;
 border:1px solid #d6aa59;
 border-radius:18px;
}
h1{text-align:center;color:#d6aa59}
.subtitle{text-align:center;color:#ddd}
label{display:block;margin-top:16px;font-size:14px}
input,select{
 width:100%;
 padding:13px;
 margin-top:7px;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:15px;
}
button{
 width:100%;
 padding:14px;
 margin-top:20px;
 background:#982f2c;
 color:white;
 border:0;
 border-radius:8px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5}
.dates{
 display:flex;
 gap:12px;
 flex-wrap:wrap;
 margin-top:12px;
}
.dates label{
 display:flex;
 align-items:center;
 gap:5px;
 margin:0;
}
.dates input{width:auto}
.member{
 padding:18px;
 margin-top:18px;
 border:1px solid #d6aa59;
 border-radius:12px;
}
#message{
 margin-top:20px;
 text-align:center;
 line-height:1.7;
}
.pass{
 background:white;
 color:#222;
 padding:20px;
 margin-top:20px;
 border-radius:12px;
 text-align:center;
}
.qr{
 display:flex;
 justify-content:center;
 margin:20px;
}
.small{font-size:12px;color:#ddd}
</style>
</head>

<body>

<div class="container">

<h1>AYAZ MELO 2026</h1>
<p class="subtitle">FREE ENTRY REGISTRATION</p>

<p style="text-align:center">
19–21 December 2026<br>
Khanabadosh Writers' Cafe<br>
Hyderabad, Sindh
</p>

<form id="registrationForm">

<label>Registration Type</label>
<select id="type" required>
<option value="individual">Individual Registration</option>
<option value="family">Family Registration</option>
</select>

<label>Number of Family Members</label>
<select id="count" style="display:none">
<option value="2">2 Members</option>
<option value="3">3 Members</option>
<option value="4">4 Members</option>
<option value="5">5 Members</option>
<option value="6">6 Members</option>
<option value="7">7 Members</option>
<option value="8">8 Members</option>
</select>

<label>Select Event Days</label>
<div class="dates">
<label><input type="checkbox" value="2026-12-19"> 19 Dec</label>
<label><input type="checkbox" value="2026-12-20"> 20 Dec</label>
<label><input type="checkbox" value="2026-12-21"> 21 Dec</label>
</div>

<div id="members"></div>

<button type="submit" id="submitBtn">
REGISTER NOW — FREE
</button>

</form>

<div id="message"></div>
<div id="passes"></div>

</div>

<script>

const SUPABASE_URL =
"https://fstkhwoxbgdcdfwycggu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BNRfiLDVM-892aVwO_hJw_OAhEgTrq";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const type = document.getElementById("type");
const count = document.getElementById("count");
const members = document.getElementById("members");
const form = document.getElementById("registrationForm");
const message = document.getElementById("message");
const passes = document.getElementById("passes");

function makeMembers(){

 const total = type.value === "individual"
 ? 1 : Number(count.value);

 members.innerHTML = "";

 for(let i=0;i<total;i++){

 const div=document.createElement("div");
 div.className="member";

 div.innerHTML=`
 <h3>Member ${i+1}</h3>

 <label>Full Name</label>
 <input name="name" required>

 <label>Father Name</label>
 <input name="father" required>

 <label>Contact Number</label>
 <input name="phone" type="tel" required>

 <label>City</label>
 <input name="city" required>

 <label>Designation</label>
 <input name="designation" placeholder="Student / Teacher / Other" required>

 <label>Email Address</label>
 <input name="email" type="email" required>
 `;

 members.appendChild(div);
 }
}

type.addEventListener("change",()=>{
 count.style.display =
 type.value==="family" ? "block":"none";
 makeMembers();
});

count.addEventListener("change",makeMembers);

makeMembers();

function createPass(visitor){

 const box=document.createElement("div");
 box.className="pass";

 const heading=document.createElement("h2");
 heading.textContent="AYAZ MELO 2026";

 const welcome=document.createElement("h3");
 welcome.textContent="Registration Successful!";

 const id=document.createElement("p");
 id.textContent="Registration ID: "+visitor.registration_id;

 const dates=document.createElement("p");
 dates.textContent="Entry Dates: "+visitor.allowed_event_dates.join(", ");

 const qr=document.createElement("div");
 qr.className="qr";

 const verifyURL=new URL("verify.html",location.href);
 verifyURL.searchParams.set("id",visitor.registration_id);
 verifyURL.searchParams.set("token",visitor.qr_token);

 box.append(heading,welcome,id,dates,qr);
 passes.appendChild(box);

 new QRCode(qr,{
  text:verifyURL.href,
  width:200,
  height:200,
  correctLevel:QRCode.CorrectLevel.H
 });

 const download=document.createElement("button");
 download.textContent="DOWNLOAD ENTRY PASS";

 download.onclick=()=>{
  const canvas=qr.querySelector("canvas");
  const img=qr.querySelector("img");
  const data=canvas
   ? canvas.toDataURL("image/png")
   : img.src;

  const link=document.createElement("a");
  link.href=data;
  link.download="Ayaz-Melo-"+visitor.registration_id+".png";
  link.click();
 };

 box.appendChild(download);
}

form.addEventListener("submit",async(e)=>{

 e.preventDefault();

 const selectedDates=[
 ...document.querySelectorAll(".dates input:checked")
 ].map(x=>x.value);

 if(selectedDates.length===0){
  alert("Please select at least one event day.");
  return;
 }

 const entries=[
 ...members.querySelectorAll(".member")
 ];

 const familyId=type.value==="family"
 ? crypto.randomUUID()
 : null;

 const button=document.getElementById("submitBtn");
 button.disabled=true;
 button.textContent="REGISTERING...";

 message.textContent="Please wait...";

 passes.innerHTML="";

 let successful=0;

 try{

 for(const entry of entries){

  const get=(name)=>
   entry.querySelector(`[name="${name}"]`).value.trim();

  const {data,error}=await db.rpc(
   "register_visitor_v2",
   {
    p_full_name:get("name"),
    p_father_name:get("father"),
    p_contact_number:get("phone"),
    p_city:get("city"),
    p_designation:get("designation"),
    p_email:get("email"),
    p_allowed_event_dates:selectedDates,
    p_family_group_id:familyId
   }
  );

  if(error) throw error;

  if(!data || !data.length){
   throw new Error("Registration response missing.");
  }

  createPass(data[0]);
  successful++;
 }

 message.textContent=
 "Congratulations! "+successful+
 " registration(s) completed successfully. Welcome to Ayaz Melo 2026!";

 form.reset();
 count.style.display="none";
 makeMembers();

 }catch(error){

 console.error(error);

 message.textContent=
 "Registration error: "+error.message+
 " Please contact the registration team.";

 }finally{

 button.disabled=false;
 button.textContent="REGISTER NOW — FREE";

 }

});

</script>
</body>
</html>
