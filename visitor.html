<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaz Melo 2026 - Free Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f3f5f4;color:#222}
.container{max-width:850px;margin:20px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 4px 20px #0001}
.header{text-align:center;margin-bottom:30px}
.header h1{color:#176b45}
.header p{color:#666;line-height:1.6}
.badge{display:inline-block;background:#e4f6eb;color:#176b45;padding:9px 20px;border-radius:30px;font-weight:bold}
h2{color:#176b45;font-size:20px;margin-top:28px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:15px;background:white}
input:focus,select:focus{outline:none;border-color:#176b45}
.dates{display:flex;gap:12px;flex-wrap:wrap}
.date-option{flex:1;min-width:150px;border:1px solid #ddd;padding:14px;border-radius:8px;background:#fafafa}
.date-option label{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}
.date-option input{width:auto}
.member-card{border:1px solid #ddd;border-radius:10px;padding:18px;margin-top:18px;background:#fcfcfc}
.member-card h3{color:#176b45;margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{cursor:pointer;border:0;border-radius:7px;padding:13px 20px;font-size:15px;font-weight:bold}
.primary{width:100%;margin-top:25px;background:#176b45;color:white}
.secondary{background:#e8f2ec;color:#176b45;margin-top:15px}
.remove{background:#ffe8e8;color:#b42318;margin-top:12px}
button:disabled{opacity:.6;cursor:not-allowed}
#message{display:none;margin-top:20px;padding:12px;border-radius:7px;line-height:1.5}
.success{display:block!important;background:#e4f6eb;color:#176b45}
.error{display:block!important;background:#ffe8e8;color:#b42318}
#results{margin-top:30px}
.pass-card{border:2px dashed #176b45;border-radius:12px;padding:20px;margin:20px 0;text-align:center;page-break-inside:avoid}
.pass-card h3{color:#176b45}
.qr-box{display:flex;justify-content:center;margin:18px auto}
.pass-card p{overflow-wrap:anywhere}
.hidden{display:none!important}

@media(max-width:600px){
.container{padding:18px}
.grid{grid-template-columns:1fr}
.dates{flex-direction:column}
}

@media print{
body{background:white;padding:0}
.container{box-shadow:none;margin:0;max-width:100%}
.header,form,#message,.pass-actions,.print-heading{display:none!important}
#results{display:block!important}
.pass-card{break-inside:avoid;margin:15px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>AYAZ MELO 2026</h1>
<p>Visitor Registration<br>19 – 21 December 2026</p>
<div class="badge">100% FREE REGISTRATION</div>
</div>

<form id="registrationForm">

<h2>Registration Information</h2>

<label for="registrationType">Registration Type</label>
<select id="registrationType" required>
<option value="individual">Individual Registration</option>
<option value="family">Family Registration</option>
</select>

<h2>Select Event Days</h2>
<p>Select the days you want to attend.</p>

<div class="dates">

<div class="date-option">
<label>
<input type="checkbox" name="eventDates" value="2026-12-19">
19 December 2026
</label>
</div>

<div class="date-option">
<label>
<input type="checkbox" name="eventDates" value="2026-12-20">
20 December 2026
</label>
</div>

<div class="date-option">
<label>
<input type="checkbox" name="eventDates" value="2026-12-21">
21 December 2026
</label>
</div>

</div>

<h2 id="detailsHeading">Visitor Information</h2>
<div id="membersContainer"></div>

<button type="button" id="addMemberBtn" class="secondary hidden">
+ Add Family Member
</button>

<button type="submit" id="submitBtn" class="primary">
Submit Free Registration
</button>

</form>

<div id="message"></div>
<div id="results"></div>

</div>

<script>
const SUPABASE_URL = "https://fstkhwoxbgdcdfwycggu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BNRQfiLDVM-892aVwO_hJw_OAhEgTrq";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("registrationForm");
const registrationType = document.getElementById("registrationType");
const membersContainer = document.getElementById("membersContainer");
const addMemberBtn = document.getElementById("addMemberBtn");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const results = document.getElementById("results");
const detailsHeading = document.getElementById("detailsHeading");

function showMessage(text,type){
    message.textContent = text;
    message.className = type;
    message.style.display = "block";
}

function addMember(){
    const family = registrationType.value === "family";
    const cards = membersContainer.querySelectorAll(".member-card");

    if(family && cards.length >= 8){
        showMessage("Maximum 8 family members are allowed.","error");
        return;
    }

    const card = document.createElement("div");
    card.className = "member-card";

    card.innerHTML = `
        <h3></h3>
        <div class="grid">

            <div>
                <label>Full Name *</label>
                <input type="text" name="full_name" required>
            </div>

            <div>
                <label>Father Name *</label>
                <input type="text" name="father_name" required>
            </div>

            <div>
                <label>Contact Number *</label>
                <input type="tel" name="contact_number" required>
            </div>

            <div>
                <label>City *</label>
                <input type="text" name="city" required>
            </div>

            <div>
                <label>Designation *</label>
                <input type="text" name="designation" required>
            </div>

            <div>
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>

            <div>
                <label>Gender *</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

        </div>

        ${family && cards.length > 0
            ? '<button type="button" class="remove">Remove Member</button>'
            : ''
        }
    `;

    const removeBtn = card.querySelector(".remove");

    if(removeBtn){
        removeBtn.addEventListener("click",()=>{
            card.remove();
            updateMembers();
        });
    }

    membersContainer.appendChild(card);
    updateMembers();
}

function updateMembers(){
    const cards = membersContainer.querySelectorAll(".member-card");
    const family = registrationType.value === "family";

    detailsHeading.textContent = family
        ? "Family Members"
        : "Visitor Information";

    cards.forEach((card,index)=>{
        card.querySelector("h3").textContent = family
            ? "Member " + (index + 1)
            : "Visitor Information";
    });

    addMemberBtn.classList.toggle(
        "hidden",
        !family || cards.length >= 8
    );
}

registrationType.addEventListener("change",()=>{
    membersContainer.innerHTML = "";
    results.innerHTML = "";
    message.style.display = "none";
    addMember();
});

addMemberBtn.addEventListener("click",addMember);

function getMembers(){
    return Array.from(
        membersContainer.querySelectorAll(".member-card")
    ).map(card=>{
        const member = {};

        card.querySelectorAll("input,select").forEach(input=>{
            member[input.name] = input.value.trim();
        });

        return member;
    });
}

function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g,char=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

function downloadQR(container,id){
    const canvas = container.querySelector("canvas");
    const img = container.querySelector("img");

    const url = canvas
        ? canvas.toDataURL("image/png")
        : img?.src;

    if(!url){
        alert("QR Code is not ready.");
        return;
    }

    const link = document.createElement("a");
    link.href = url;
    link.download = "AyazMelo-" + id + ".png";

    document.body.appendChild(link);
    link.click();
    link.remove();
}

function generatePasses(data,dates){
    results.innerHTML = `
        <h2 class="print-heading">Registration Successful!</h2>
        <p class="print-heading">
            Your Ayaz Melo 2026 registration is confirmed.
            Entry is FREE.
        </p>
    `;

    data.forEach((member,index)=>{
        const pass = document.createElement("div");
        pass.className = "pass-card";

        const qrId = "qr_" + index;

        pass.innerHTML = `
            <h3>AYAZ MELO 2026</h3>
            <p><strong>OFFICIAL VISITOR PASS</strong></p>
            <p><strong>Name:</strong> ${escapeHTML(member.full_name)}</p>
            <p><strong>Registration ID:</strong> ${escapeHTML(member.registration_id)}</p>
            <p><strong>Event Dates:</strong> ${dates.map(escapeHTML).join(", ")}</p>
            <p><strong>ENTRY: FREE</strong></p>
            <div class="qr-box" id="${qrId}"></div>
            <div class="pass-actions">
                <button type="button" class="primary download-btn">
                    Download QR
                </button>
            </div>
        `;

        results.appendChild(pass);

        const qrContainer = pass.querySelector("#" + qrId);

        new QRCode(qrContainer,{
            text: member.qr_token,
            width: 190,
            height: 190,
            correctLevel: QRCode.CorrectLevel.H
        });

        pass.querySelector(".download-btn").addEventListener("click",()=>{
            downloadQR(qrContainer,member.registration_id);
        });
    });

    const printBtn = document.createElement("button");
    printBtn.className = "primary";
    printBtn.textContent = "Print All Visitor Passes";

    printBtn.addEventListener("click",()=>window.print());

    results.appendChild(printBtn);
    results.scrollIntoView({behavior:"smooth"});
}

form.addEventListener("submit",async event=>{
    event.preventDefault();

    message.style.display = "none";
    results.innerHTML = "";

    const type = registrationType.value;

    const dates = Array.from(
        document.querySelectorAll('input[name="eventDates"]:checked')
    ).map(input=>input.value);

    const members = getMembers();

    if(dates.length < 1 || dates.length > 3){
        showMessage("Please select at least one event day.","error");
        return;
    }

    if(type === "individual" && members.length !== 1){
        showMessage("Individual registration requires one visitor.","error");
        return;
    }

    if(type === "family" && (members.length < 2 || members.length > 8)){
        showMessage("Family registration requires 2 to 8 members.","error");
        return;
    }

    for(const member of members){
        if(
            !member.full_name ||
            !member.father_name ||
            !member.contact_number ||
            !member.city ||
            !member.designation ||
            !member.email ||
            !member.gender
        ){
            showMessage("Please complete all visitor information.","error");
            return;
        }
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting Registration...";

    try{
        const {data,error} = await supabaseClient.rpc(
            "register_visitor_v2",
            {
                p_registration_type: type,
                p_event_dates: dates,
                p_members: members
            }
        );

        if(error){
            console.error("Supabase registration error:",error);
            throw new Error(error.message || "Database registration failed.");
        }

        if(!data || !Array.isArray(data) || data.length !== members.length){
            throw new Error("Registration response is incomplete.");
        }

        showMessage(
            "Registration completed successfully! Entry is FREE.",
            "success"
        );

        generatePasses(data,dates);

        form.reset();
        membersContainer.innerHTML = "";
        addMember();

    }catch(error){
        console.error(error);
        showMessage(
            error.message || "Registration failed. Please try again.",
            "error"
        );
    }finally{
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Free Registration";
    }
});

addMember();

</script>
</body>
</html>
