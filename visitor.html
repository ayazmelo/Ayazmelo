<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayaz Melo 2026 | Visitor Registration</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f4;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 20px auto;
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #176b45;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            line-height: 1.6;
        }

        .free-badge {
            display: inline-block;
            background: #e4f6eb;
            color: #176b45;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        h2 {
            color: #176b45;
            font-size: 20px;
            margin-top: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 14px 0 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #176b45;
        }

        .dates {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .date-option {
            flex: 1;
            min-width: 150px;
            border: 1px solid #ddd;
            padding: 14px;
            border-radius: 8px;
            background: #fafafa;
        }

        .date-option label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            cursor: pointer;
        }

        .date-option input {
            width: auto;
        }

        .member-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-top: 18px;
            background: #fcfcfc;
        }

        .member-card h3 {
            color: #176b45;
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 7px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: bold;
        }

        .primary-btn {
            width: 100%;
            margin-top: 25px;
            background: #176b45;
            color: white;
        }

        .primary-btn:hover {
            background: #105536;
        }

        .secondary-btn {
            background: #e8f2ec;
            color: #176b45;
            margin-top: 15px;
        }

        .remove-btn {
            background: #ffe8e8;
            color: #b42318;
            margin-top: 12px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
            display: none;
            line-height: 1.5;
        }

        .success {
            display: block !important;
            background: #e4f6eb;
            color: #176b45;
        }

        .error {
            display: block !important;
            background: #ffe8e8;
            color: #b42318;
        }

        #results {
            margin-top: 30px;
        }

        .pass-card {
            border: 2px dashed #176b45;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            page-break-inside: avoid;
        }

        .pass-card h3 {
            color: #176b45;
        }

        .qr-box {
            display: flex;
            justify-content: center;
            margin: 18px auto;
        }

        .pass-card p {
            overflow-wrap: anywhere;
        }

        .pass-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pass-actions button {
            background: #176b45;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        @media(max-width: 600px) {
            .container {
                padding: 18px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .dates {
                flex-direction: column;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                margin: 0;
                max-width: 100%;
            }

            .header,
            form,
            #message,
            .pass-actions,
            .print-heading {
                display: none !important;
            }

            #results {
                display: block !important;
            }

            .pass-card {
                break-inside: avoid;
                margin: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AYAZ MELO 2026</h1>
        <p>
            Visitor Registration<br>
            19 – 21 December 2026
        </p>
        <div class="free-badge">100% FREE REGISTRATION</div>
    </div>

    <form id="registrationForm">

        <h2>Registration Information</h2>

        <label for="registrationType">Registration Type</label>
        <select id="registrationType" required>
            <option value="individual">Individual Registration</option>
            <option value="family">Family Registration</option>
        </select>

        <h2>Select Event Days</h2>

        <p>Select the days you want to attend.</p>

        <div class="dates">

            <div class="date-option">
                <label>
                    <input type="checkbox" name="eventDates" value="2026-12-19">
                    19 December 2026
                </label>
            </div>

            <div class="date-option">
                <label>
                    <input type="checkbox" name="eventDates" value="2026-12-20">
                    20 December 2026
                </label>
            </div>

            <div class="date-option">
                <label>
                    <input type="checkbox" name="eventDates" value="2026-12-21">
                    21 December 2026
                </label>
            </div>

        </div>

        <h2>Attendance Centre</h2>

        <label for="attendanceCenter">Select / Enter Attendance Centre</label>
        <input
            type="text"
            id="attendanceCenter"
            placeholder="Enter attendance centre"
            required
        >

        <h2>Visitor Details</h2>

        <div id="membersContainer"></div>

        <button type="button" id="addMemberBtn" class="secondary-btn hidden">
            + Add Family Member
        </button>

        <button type="submit" id="submitBtn" class="primary-btn">
            Submit Free Registration
        </button>

    </form>

    <div id="message"></div>

    <div id="results"></div>

</div>

<script>
    // =====================================
    // SUPABASE CONFIGURATION
    // =====================================

    const SUPABASE_URL =
        "https://fstkhwoxbgdcdfwycggu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "YOUR_SB_PUBLISHABLE_KEY";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    // =====================================
    // ELEMENTS
    // =====================================

    const form = document.getElementById("registrationForm");
    const registrationType = document.getElementById("registrationType");
    const membersContainer = document.getElementById("membersContainer");
    const addMemberBtn = document.getElementById("addMemberBtn");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const results = document.getElementById("results");

    let memberCount = 0;

    // =====================================
    // MESSAGE
    // =====================================

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
        message.style.display = "block";
    }

    // =====================================
    // MEMBER FORM
    // =====================================

    function addMember() {

        if (memberCount >= 8) {
            showMessage("Maximum 8 family members are allowed.", "error");
            return;
        }

        memberCount++;

        const card = document.createElement("div");
        card.className = "member-card";
        card.dataset.member = memberCount;

        card.innerHTML = `
            <h3>Member ${memberCount}</h3>

            <div class="grid">

                <div>
                    <label>Full Name *</label>
                    <input type="text" name="full_name" required>
                </div>

                <div>
                    <label>Father Name *</label>
                    <input type="text" name="father_name" required>
                </div>

                <div>
                    <label>Contact Number *</label>
                    <input type="tel" name="contact_number" required>
                </div>

                <div>
                    <label>City *</label>
                    <input type="text" name="city" required>
                </div>

                <div>
                    <label>Designation *</label>
                    <input type="text" name="designation" required>
                </div>

                <div>
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>

                <div>
                    <label>Gender *</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

            </div>

            ${
                memberCount > 1
                ? `<button type="button" class="remove-btn">Remove Member</button>`
                : ""
            }
        `;

        const removeButton = card.querySelector(".remove-btn");

        if (removeButton) {
            removeButton.addEventListener("click", function() {
                card.remove();
                updateMemberNumbers();
            });
        }

        membersContainer.appendChild(card);
        updateMemberNumbers();
    }

    // =====================================
    // UPDATE MEMBER NUMBERS
    // =====================================

    function updateMemberNumbers() {

        const cards = membersContainer.querySelectorAll(".member-card");

        memberCount = cards.length;

        cards.forEach((card, index) => {
            card.querySelector("h3").textContent =
                "Member " + (index + 1);
        });

        addMemberBtn.classList.toggle(
            "hidden",
            registrationType.value !== "family" || memberCount >= 8
        );
    }

    // =====================================
    // REGISTRATION TYPE CHANGE
    // =====================================

    registrationType.addEventListener("change", function() {

        membersContainer.innerHTML = "";
        memberCount = 0;

        addMember();

        addMemberBtn.classList.toggle(
            "hidden",
            this.value !== "family"
        );

        message.style.display = "none";
        results.innerHTML = "";
    });

    addMemberBtn.addEventListener("click", addMember);

    // First member
    addMember();

    // =====================================
    // GET MEMBERS DATA
    // =====================================

    function getMembersData() {

        const cards = membersContainer.querySelectorAll(".member-card");

        const members = [];

        cards.forEach(card => {

            const member = {};

            card.querySelectorAll("input, select").forEach(input => {
                member[input.name] = input.value.trim();
            });

            members.push(member);
        });

        return members;
    }

    // =====================================
    // GENERATE REGISTRATION PASSES
    // =====================================

    function generatePasses(data, selectedDates, attendanceCenter) {

        results.innerHTML = `
            <h2 class="print-heading">Registration Successful!</h2>
            <p class="print-heading">
                Your Ayaz Melo 2026 registration is confirmed.
                Your registration is completely free.
            </p>
        `;

        data.forEach((member, index) => {

            const pass = document.createElement("div");
            pass.className = "pass-card";

            const qrId = "qr_" + index;

            pass.innerHTML = `
                <h3>AYAZ MELO 2026</h3>
                <p><strong>OFFICIAL VISITOR PASS</strong></p>

                <p><strong>Name:</strong> ${escapeHTML(member.full_name)}</p>

                <p><strong>Registration ID:</strong>
                    ${escapeHTML(member.registration_id)}
                </p>

                <p><strong>Attendance Centre:</strong>
                    ${escapeHTML(attendanceCenter)}
                </p>

                <p><strong>Event Dates:</strong>
                    ${selectedDates.join(", ")}
                </p>

                <p><strong>Entry:</strong> FREE</p>

                <div class="qr-box" id="${qrId}"></div>

                <div class="pass-actions">
                    <button type="button" class="download-btn">
                        Download QR
                    </button>
                </div>
            `;

            results.appendChild(pass);

            const qrContainer = pass.querySelector("#" + qrId);

            new QRCode(qrContainer, {
                text: member.qr_token,
                width: 190,
                height: 190,
                correctLevel: QRCode.CorrectLevel.H
            });

            pass.querySelector(".download-btn").addEventListener(
                "click",
                function() {
                    downloadQR(qrContainer, member.registration_id);
                }
            );

        });

        const printButton = document.createElement("button");

        printButton.type = "button";
        printButton.className = "primary-btn";
        printButton.textContent = "Print All Visitor Passes";

        printButton.addEventListener("click", function() {
            window.print();
        });

        results.appendChild(printButton);

        results.scrollIntoView({
            behavior: "smooth"
        });
    }

    // =====================================
    // HTML ESCAPE
    // =====================================

    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    // =====================================
    // DOWNLOAD QR
    // =====================================

    function downloadQR(container, registrationId) {

        const canvas = container.querySelector("canvas");
        const image = container.querySelector("img");

        let imageURL;

        if (canvas) {
            imageURL = canvas.toDataURL("image/png");
        } else if (image) {
            imageURL = image.src;
        } else {
            alert("QR Code is not ready yet.");
            return;
        }

        const link = document.createElement("a");

        link.href = imageURL;
        link.download = "AyazMelo-" + registrationId + ".png";

        document.body.appendChild(link);
        link.click();
        link.remove();
    }

    // =====================================
    // FORM SUBMISSION
    // =====================================

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.style.display = "none";
        results.innerHTML = "";

        const type = registrationType.value;

        const selectedDates = Array.from(
            document.querySelectorAll(
