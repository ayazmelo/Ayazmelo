<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volunteer Result | Ayaz Melo 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#faf5eb;
 font-family:Montserrat,Arial,sans-serif;
 color:#252238;
}
header{
 background:#21164d;
 color:white;
 text-align:center;
 padding:25px 15px;
}
header h1{
 font:700 36px "Cormorant Garamond",serif;
 margin:0;
 color:#d9ae62;
}
header p{font-size:11px;letter-spacing:2px}
.container{
 width:92%;
 max-width:550px;
 margin:45px auto;
}
.card{
 background:white;
 padding:30px;
 border-radius:15px;
 border:1px solid #e9e3d9;
 box-shadow:0 10px 35px #21164d12;
 text-align:center;
}
h2{
 font:700 32px "Cormorant Garamond",serif;
 color:#21164d;
}
label{
 display:block;
 text-align:left;
 font-size:12px;
 font-weight:700;
}
input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:7px;
 margin:10px 0 17px;
 font-size:15px;
}
button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:7px;
 background:#21164d;
 color:white;
 font-weight:700;
 cursor:pointer;
}
button:disabled{opacity:.6}
#result{
 display:none;
 margin-top:25px;
 padding:22px;
 border-radius:10px;
}
.success{background:#e5f5e9;color:#176d43}
.failure{background:#fbe8e9;color:#a51f30}
#result h3{font-size:19px}
#result p{font-size:13px;line-height:1.8}
footer{
 text-align:center;
 padding:25px;
 font-size:11px;
 color:#777;
}
</style>
</head>

<body>

<header>
 <h1>AYAZ MELO 2026</h1>
 <p>VOLUNTEER RESULT PORTAL</p>
</header>

<div class="container">
 <div class="card">

  <h2>Volunteer Result</h2>
  <p>Check your interview result for Ayaz Melo 2026.</p>

  <form id="resultForm">
   <label>Enter Your CNIC Number</label>
   <input
    id="cnic"
    type="text"
    maxlength="15"
    placeholder="XXXXX-XXXXXXX-X"
    required
   >
   <button id="checkBtn" type="submit">
    CHECK MY RESULT
   </button>
  </form>

  <div id="result"></div>

 </div>
</div>

<footer>
 © 2026 Ayaz Melo · Khanabadosh Writer's Cafe
 <br>Hyderabad, Sindh, Pakistan
</footer>

<script>
const SUPABASE_URL =
"https://fstkhwoxbgdcdfwycggu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BNRQfiLDVM-892aVwO_hJw_OAhEgTrq";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const form = document.getElementById("resultForm");
const result = document.getElementById("result");
const button = document.getElementById("checkBtn");

function normalizeCNIC(value){
 return value.replace(/[^0-9]/g,"");
}

form.addEventListener("submit",async function(e){

 e.preventDefault();

 const cnic = normalizeCNIC(
  document.getElementById("cnic").value
 );

 result.style.display="block";
 result.className="";
 result.textContent="Checking your result...";

 if(cnic.length!==13){
  result.className="failure";
  result.textContent="Please enter a valid 13-digit CNIC.";
  return;
 }

 button.disabled=true;
 button.textContent="PLEASE WAIT...";

 try{

  const {data,error} = await db
   .from("volunteers")
   .select("selection_status")
   .eq("cnic",cnic.replace(
    /^(\d{5})(\d{7})(\d)$/,
    "$1-$2-$3"
   ))
   .maybeSingle();

  if(error)throw error;

  if(!data){
   result.className="failure";
   result.innerHTML="<h3>Record Not Found</h3><p>Please verify your CNIC number.</p>";
   return;
  }

  const status=String(
   data.selection_status||"Pending"
  ).trim().toLowerCase();

  if(status==="selected"){

   result.className="success";
   result.innerHTML=`
    <h3>Congratulations!</h3>
    <p>
    You are qualified for the Ayaz Melo Volunteer Training.
    <br><br>
    You have successfully qualified for the interview stage.
    Further instructions regarding training will be communicated by the organizing team.
    </p>
   `;

  }else if(status==="rejected"){

   result.className="failure";
   result.innerHTML=`
    <h3>Interview Result</h3>
    <p>
    We regret to inform you that you are not qualified for the interview.
    <br><br>
    Thank you for your interest in Ayaz Melo 2026.
    </p>
   `;

  }else if(status==="absent"){

   result.className="failure";
   result.innerHTML=`
    <h3>Interview Result</h3>
    <p>
    You were marked absent during the interview.
    Therefore, you are not qualified for the next phase.
    </p>
   `;

  }else{

   result.className="";
   result.innerHTML=`
    <h3>Result Pending</h3>
    <p>Your interview result has not been finalized yet. Please check again later.</p>
   `;
  }

 }catch(error){

  console.error(error);
  result.className="failure";
  result.textContent="Unable to check your result. Please try again later.";

 }finally{

  button.disabled=false;
  button.textContent="CHECK MY RESULT";

 }

});
</script>

</body>
</html>
