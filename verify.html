<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaz Melo 2026 - Visitor Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101827;
    font-family: Arial, sans-serif;
    color: white;
}

.card {
    width: 100%;
    max-width: 430px;
    background: #1d293b;
    padding: 30px 22px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #f5c451;
    margin-bottom: 8px;
}

.subtitle {
    color: #cbd5e1;
    font-size: 14px;
    margin-bottom: 25px;
}

.status {
    font-size: 23px;
    font-weight: bold;
    margin: 20px 0;
}

.valid {
    color: #4ade80;
}

.invalid {
    color: #fb7185;
}

.waiting {
    color: #facc15;
}

.details {
    color: #e2e8f0;
    line-height: 1.7;
    font-size: 15px;
}

button {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 9px;
    background: #f5c451;
    color: #101827;
    font-size: 15px;
    font-weight: bold;
    margin-top: 22px;
    cursor: pointer;
}

.footer {
    color: #94a3b8;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">AYAZ MELO 2026</div>

    <div class="subtitle">
        Official Visitor Verification Portal
    </div>

    <div id="loader" class="status waiting">
        Checking Registration...
    </div>

    <div id="result" style="display:none;">

        <div id="status" class="status"></div>

        <div id="details" class="details"></div>

        <a href="visitor.html">
            <button>VISITOR REGISTRATION</button>
        </a>

        <a href="index.html">
            <button style="background:#334155;color:white;">
                BACK TO WEBSITE
            </button>
        </a>

    </div>

    <div class="footer">
        Ayaz Melo 2026 | Khanabadosh
    </div>

</div>

<script>

const SUPABASE_URL =
"https://fstkhwoxbgdcdfwycggu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BNRQfiLDVM-892aVwO_hJw_OAhEgTrq";

const loader = document.getElementById("loader");
const result = document.getElementById("result");
const statusBox = document.getElementById("status");
const details = document.getElementById("details");

function show(title, type, message) {

    loader.style.display = "none";
    result.style.display = "block";

    statusBox.textContent = title;
    statusBox.className = "status " + type;

    details.innerHTML = message;
}

async function verifyVisitor() {

    const params = new URLSearchParams(window.location.search);

    const id = params.get("id");
    const token = params.get("token");

    // If page is opened without scanning a QR code

    if (!id || !token) {

        show(
            "AYAZ MELO 2026",
            "valid",
            `
            <h3>Visitor Verification Portal</h3>
            <p>
            Welcome to Ayaz Melo 2026.
            </p>
            <p>
            Please scan a registered visitor QR code
            to verify registration.
            </p>
            `
        );

        return;
    }

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/rpc/verify_visitor",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                },

                body: JSON.stringify({
                    p_registration_id: id,
                    p_qr_token: token
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Verification request failed."
            );
        }

        const visitor = Array.isArray(data) ? data[0] : data;

        if (!visitor || !visitor.registration_id) {

            show(
                "INVALID QR CODE",
                "invalid",
                "This registration could not be verified."
            );

            return;
        }

        if (visitor.entry_status === "NOT ENTERED") {

            show(
                "VALID REGISTRATION",
                "valid",
                `
                <h3>Registration Verified</h3>
                <p><b>Registration ID:</b><br>
                ${visitor.registration_id}</p>
                <p><b>Entry Status:</b><br>
                NOT ENTERED</p>
                <p>Please proceed to the entry desk.</p>
                `
            );

        } else {

            show(
                "ALREADY ENTERED",
                "waiting",
                `
                <h3>Visitor Already Checked In</h3>
                <p><b>Registration ID:</b><br>
                ${visitor.registration_id}</p>
                <p><b>Entry Status:</b><br>
                ${visitor.entry_status}</p>
                `
            );

        }

    } catch (error) {

        show(
            "VERIFICATION ERROR",
            "invalid",
            "Unable to verify this QR code. Please try again.<br><br>" +
            error.message
        );

    }

}

verifyVisitor();

</script>

</body>
</html>
