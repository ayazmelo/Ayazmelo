<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaz Melo | Visitor Verification</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f5f0e8;
 color:#201b35;
 font-family:Arial,sans-serif;
}
header{
 background:#30205d;
 color:white;
 padding:25px;
 text-align:center;
}
header h1{margin:0;color:#f5ae35}
.container{
 max-width:550px;
 margin:40px auto;
 padding:25px;
}
.card{
 background:white;
 padding:30px;
 border-radius:18px;
 box-shadow:0 8px 30px #0001;
}
h2{text-align:center}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:8px;
 background:#30205d;
 color:white;
 font-weight:bold;
 cursor:pointer;
 margin-top:15px;
}
#reader{margin-top:20px}
#result{
 margin-top:25px;
 padding:20px;
 border-radius:12px;
 display:none;
}
.success{background:#d9f4df;color:#14532d}
.error{background:#ffe0e0;color:#8b1717}
.info{
 padding:10px;
 border-bottom:1px solid #eee;
}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>

<body>

<header>
<h1>KHANABADOSH</h1>
<p>AYAZ MELO 2026</p>
<small>OFFICIAL VISITOR VERIFICATION PORTAL</small>
</header>

<div class="container">
<div class="card">

<h2>Visitor Entry Verification</h2>

<p style="text-align:center">
Scan the visitor's QR code to verify registration.
</p>

<div id="reader"></div>

<button onclick="startScanner()">
SCAN VISITOR QR CODE
</button>

<div id="result"></div>

</div>
</div>

<footer>
© 2026 Ayaz Melo · Khanabadosh Writers' Cafe
</footer>

<script>

const SUPABASE_URL =
"https://fstkhwoxbgdcdfwycggu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BNRQfiLDVM-892aVwO_hJw_OAhEgTrq";

const supabase = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let scanner = null;
let processing = false;

function showResult(html,type){

 const box=document.getElementById("result");

 box.style.display="block";
 box.className=type;
 box.innerHTML=html;

}

async function verifyVisitor(registrationId,qrToken){

 if(processing)return;

 if(!registrationId || !qrToken){

 showResult(
 "Invalid QR Code. Registration information is missing.",
 "error"
 );

 return;
 }

 processing=true;

 showResult("Verifying visitor...","");

 try{

 const {data,error}=await supabase.rpc(
 "verify_visitor",
 {
  p_registration_id:registrationId,
  p_qr_token:qrToken
 }
 );

 if(error)throw error;

 const visitor=Array.isArray(data)?data[0]:data;

 if(!visitor){
 throw new Error("Visitor record not found.");
 }

 const status=String(
 visitor.entry_status || ""
 ).toUpperCase();

 if(status==="ENTERED" || status==="ALREADY_ENTERED"){

 showResult(`
 <h2>⚠️ ALREADY ENTERED</h2>
 <p>This QR code has already been used.</p>
 `,"error");

 }else if(
 status==="VERIFIED" ||
 status==="SUCCESS" ||
 status==="VALID"
 ){

 showResult(`
 <h2>✓ VISITOR VERIFIED</h2>
 <div class="info">
 Registration ID: ${escapeHTML(visitor.registration_id)}
 </div>
 <div class="info">
 Entry Status: ${escapeHTML(status)}
 </div>
 <p>Visitor verification successful.</p>
 `,"success");

 }else{

 showResult(`
 <h2>VERIFICATION RESULT</h2>
 <pre>${escapeHTML(JSON.stringify(visitor,null,2))}</pre>
 `,"success");

 }

 }catch(error){

 showResult(
 "Verification Failed: "+escapeHTML(error.message),
 "error"
 );

 }finally{

 processing=false;

 }

}

function escapeHTML(value){

 return String(value ?? "").replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[char]);

}

async function startScanner(){

 if(!scanner){

 scanner=new Html5Qrcode("reader");

 }

 try{

 await scanner.start(
  {facingMode:"environment"},
  {fps:10,qrbox:250},

  async(decodedText)=>{

  await scanner.stop();

  try{

   const url=new URL(decodedText);

   const id=url.searchParams.get("registration_id");

   const token=
    url.searchParams.get("qr_token") ||
    url.searchParams.get("token");

   await verifyVisitor(id,token);

  }catch(e){

   showResult("Invalid QR link.","error");

  }

  },

  ()=>{}

 );

 }catch(error){

 showResult(
 "Camera error: "+escapeHTML(error.message),
 "error"
 );

 }

}

// Automatically verify when QR link opens directly.

const params=new URLSearchParams(location.search);

const registrationId=params.get("registration_id");

const qrToken=
 params.get("qr_token") ||
 params.get("token");

if(registrationId && qrToken){

 verifyVisitor(registrationId,qrToken);

}

</script>

</body>
</html>
