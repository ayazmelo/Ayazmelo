<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayaz Melo 2026 | Pass Verification</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#14221c;
  color:#fff;
  font-family:Arial,sans-serif;
}
.card{
  width:100%;
  max-width:440px;
  padding:32px 24px;
  text-align:center;
  background:#20352b;
  border:1px solid #c9a65b;
  border-radius:18px;
  box-shadow:0 12px 35px #0005;
}
.logo{
  color:#e5c477;
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
}
.subtitle{
  color:#d8d8d8;
  font-size:13px;
  letter-spacing:2px;
}
#result{
  margin-top:28px;
  padding:22px 15px;
  border-radius:12px;
  background:#fff;
  color:#222;
  overflow-wrap:anywhere;
}
.success{color:#168044}
.failed{color:#c62828}
.wait{color:#8a681e}
.small{
  margin-top:22px;
  color:#ccc;
  font-size:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">AYAZ MELO</div>
  <h2>2026</h2>
  <div class="subtitle">OFFICIAL ENTRY VERIFICATION</div>

  <div id="result">
    <h3 class="wait">PLEASE WAIT</h3>
    <p>Verifying your entry pass...</p>
  </div>

  <div class="small">
    19–21 December 2026<br>
    Khanabadosh Writers’ Cafe<br>
    Hyderabad, Sindh
  </div>
</div>

<script>
const SUPABASE_URL =
  "https://fstkhwoxbgdcdfwycggu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BNRfiLDVM-892aVwO_hJw_OAhEgTrq";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const result = document.getElementById("result");

function showMessage(title, message, className) {
  result.replaceChildren();

  const heading = document.createElement("h2");
  heading.className = className;
  heading.textContent = title;

  const paragraph = document.createElement("p");
  paragraph.textContent = message;

  result.append(heading, paragraph);
}

async function verifyPass() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const token = params.get("token");

  if (!id || !token) {
    showMessage(
      "INVALID QR CODE",
      "Registration details are missing.",
      "failed"
    );
    return;
  }

  if (!/^[0-9a-f-]{36}$/i.test(token)) {
    showMessage(
      "INVALID PASS",
      "QR code token is not valid.",
      "failed"
    );
    return;
  }

  try {
    const { data, error } = await db.rpc("verify_visitor", {
      p_registration_id: id,
      p_qr_token: token
    });

    if (error) {
      console.error("Supabase verification error:", error);
      showMessage(
        "VERIFICATION ERROR",
        "System could not verify this pass. Please contact the registration team.",
        "failed"
      );
      return;
    }

    if (!data || data.length === 0) {
      showMessage(
        "INVALID PASS",
        "This registration was not found.",
        "failed"
      );
      return;
    }

    const visitor = data[0];

    result.replaceChildren();

    const heading = document.createElement("h2");
    heading.className = "success";
    heading.textContent = "✓ PASS VERIFIED";

    const registration = document.createElement("p");
    registration.textContent =
      "Registration ID: " + visitor.registration_id;

    const status = document.createElement("p");
    status.textContent =
      "Entry Status: " + visitor.entry_status;

    const welcome = document.createElement("h3");
    welcome.textContent = "Welcome to Ayaz Melo 2026!";

    result.append(heading, registration, status, welcome);

  } catch (error) {
    console.error(error);
    showMessage(
      "CONNECTION ERROR",
      "Please check your internet connection and scan again.",
      "failed"
    );
  }
}

verifyPass();
</script>

</body>
</html>
